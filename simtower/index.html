<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>摩天楼と地下鉄</title>
<script>
/* Google Analytics 4 の測定ID。G-XXXXXXXXXX のままなら何も送信しない */

window.track=function(){};

  window.dataLayer=window.dataLayer||[];

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: 上に時計・数字・切替タブ（固定）、下にビル経営と市長の2画面。広い画面では左右に並べ、狭い画面ではタブで切り替える */
:root{
  --bg:#E9EDF1; --panel:#FFFFFF; --ink:#18202B; --muted:#5A6675; --rule:#CBD3DC; --tile:#DEE5EC;
  --accent:#D45E27; --accent-ink:#FFFFFF;
  --l1:#2766AE; --l2:#2B9466; --l3:#8A4CC2; --l4:#C23E78;
  --building:#2B3542; --win-off:#3B4757; --win-on:#F3BE45; --shop-on:#F08A4B; --brick:#7A4330; --home:#3D5C4C; --home-on:#FFE3A6;
  --fl-ink:#C9D3DE; --tag-bg:#C9D3DE; --tag-ink:#1A222C; --shaft:#0E141B;
  --earth:#8A6B4E; --earth-dk:#7A5D43; --under-ink:#F4EDE5; --mall:#4A3A5C; --mall-on:#F7A8C4; --park:#4B5560; --park-on:#DCE3EA; --platform:#323B47;
  --sea:#B9D3E6; --sea-line:#7FA8C8; --mount-bg:#D5DDD2; --mount:#8E9D86; --farm:#DCE6C4; --farm-line:#B7C793;
  --good:#2C8A57; --warn:#B9800F; --bad:#BC3A2E; --event:#7A55B8;
  --sky:#CFDCE8;
  --f-display:"DotGothic16","Hiragino Kaku Gothic ProN",monospace;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151C; --panel:#18202A; --ink:#E3E8EE; --muted:#95A2B1; --rule:#2B3644; --tile:#1F2833;
  --accent:#EB7A43; --accent-ink:#1A0F08;
  --l1:#5C9BE2; --l2:#45BE88; --l3:#B184E6; --l4:#E56FA3;
  --building:#2E3948; --win-off:#222B36; --win-on:#F5C858; --shop-on:#F49A62; --brick:#5E3324; --home:#2E4A3C; --home-on:#FFDD95;
  --fl-ink:#AEB9C6; --tag-bg:#AEB9C6; --tag-ink:#141A21; --shaft:#0B1016;
  --earth:#4A3828; --earth-dk:#3E2E20; --under-ink:#D8CCBE; --mall:#3B2E4A; --mall-on:#E98DB0; --park:#3A424C; --park-on:#AEB8C3; --platform:#222A34;
  --sea:#1C3448; --sea-line:#2F5677; --mount-bg:#222C27; --mount:#4A5A48; --farm:#26301F; --farm-line:#3E4D2E;
  --good:#4CC183; --warn:#E3AE3C; --bad:#EE6A5C; --event:#B497EA; --sky:#1A2533;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151C; --panel:#18202A; --ink:#E3E8EE; --muted:#95A2B1; --rule:#2B3644; --tile:#1F2833;
  --accent:#EB7A43; --accent-ink:#1A0F08;
  --l1:#5C9BE2; --l2:#45BE88; --l3:#B184E6; --l4:#E56FA3;
  --building:#2E3948; --win-off:#222B36; --win-on:#F5C858; --shop-on:#F49A62; --brick:#5E3324; --home:#2E4A3C; --home-on:#FFDD95;
  --fl-ink:#AEB9C6; --tag-bg:#AEB9C6; --tag-ink:#141A21; --shaft:#0B1016;
  --earth:#4A3828; --earth-dk:#3E2E20; --under-ink:#D8CCBE; --mall:#3B2E4A; --mall-on:#E98DB0; --park:#3A424C; --park-on:#AEB8C3; --platform:#222A34;
  --sea:#1C3448; --sea-line:#2F5677; --mount-bg:#222C27; --mount:#4A5A48; --farm:#26301F; --farm-line:#3E4D2E;
  --good:#4CC183; --warn:#E3AE3C; --bad:#EE6A5C; --event:#B497EA; --sky:#1A2533;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:14px;line-height:1.6;padding-inline:16px;padding-block:0 32px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--rule)}
.row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;letter-spacing:.04em;margin-right:auto}
.date{font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:6px 12px;min-height:36px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;min-width:0}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.06em}
.stat .v{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v.neg{color:var(--bad)}

.tabs{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.tabs button{flex:1;border:0;background:var(--panel);padding:8px;min-height:42px;font-weight:700;touch-action:manipulation}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.panes{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:880px){.tabs{display:none}.panes{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}.pane[hidden]{display:flex!important}}
.pane{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:13px;margin:0;letter-spacing:.08em;color:var(--muted);font-weight:700}
.role{font-family:var(--f-display);font-size:13px;color:var(--muted);letter-spacing:.1em}

/* タワー断面 */
.stage{border-radius:8px;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.sky{width:100%;background:var(--sky);padding-top:16px;display:flex;justify-content:center}
.tower{display:flex;flex-direction:column;width:min(calc(100% - 24px),270px)}
.roof{height:10px;margin:0 18px;background:var(--building);border-radius:3px 3px 0 0}
.floor{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:6px;background:var(--building);padding:3px 6px;border-top:1px solid var(--win-off);min-height:20px}
.fl{font-family:var(--f-display);font-size:11px;color:var(--fl-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.fl em{font-style:normal;display:inline-block;margin-left:3px;font-family:var(--f-body);font-size:10px;font-weight:700;padding:0 3px;border-radius:2px;background:var(--tag-bg);color:var(--tag-ink);vertical-align:1px}
.wins{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.w{height:12px;background:var(--win-off);border-radius:1px}
.w.on{background:var(--win-on)}
.floor.shop{background:var(--brick);box-shadow:inset 0 3px 0 var(--shop-on)}
.shop .w{height:14px} .shop .w.on{background:var(--shop-on)} .shop .wins{grid-template-columns:repeat(4,1fr)} .shop .fl em{background:var(--shop-on)}
.floor.home{background:var(--home)} .home .w.on{background:var(--home-on)} .home .wins{grid-template-columns:repeat(6,1fr)} .home .fl em{background:var(--home-on)}
.floor.mall{background:var(--mall)} .mall .w{height:14px} .mall .w.on{background:var(--mall-on)} .mall .wins{grid-template-columns:repeat(4,1fr)} .mall .fl em{background:var(--mall-on)}
.floor.parking{background:var(--park)} .parking .wins{grid-template-columns:repeat(6,1fr);gap:4px} .parking .w{height:8px;border-radius:3px;background:transparent;border:1px dashed var(--win-off)} .parking .w.on{background:var(--park-on);border-color:var(--park-on)} .parking .fl em{background:var(--park-on)}
.shafts{display:flex;gap:2px;min-width:7px}
.shaft{width:7px;height:14px;background:var(--shaft);border-radius:1px}
.shaft.busy{background:var(--bad)}
.lobby .wins{grid-template-columns:1fr 1fr 2fr 1fr 1fr}
.lobby .w.door{background:var(--win-on)}
.street{width:100%;background:var(--muted);height:6px}
.under{width:100%;background:var(--earth);background-image:radial-gradient(var(--earth-dk) 1.2px,transparent 1.4px);background-size:14px 14px;display:flex;justify-content:center;padding-bottom:12px}
.under .floor{border-top-color:var(--earth-dk)}
.floor.rock{background:transparent;border-top:1px dashed var(--under-ink)}
.rocktxt{font-size:10px;color:var(--under-ink);grid-column:2/4}
.rockblock{width:100%;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;color:var(--under-ink);font-size:12px;font-weight:700;padding:8px}
.rockblock small{font-weight:400;font-size:11px;max-width:30ch}
.rockblock.wip{border:2px dashed var(--under-ink);border-radius:4px;margin-top:66px;min-height:36px}
.floor.platform{background:var(--platform);border-top:2px solid var(--under-ink)}
.track{grid-column:2/4;position:relative;height:18px;overflow:hidden;border-bottom:2px solid var(--fl-ink)}
.train{position:absolute;top:3px;left:8px;width:52px;height:11px;border-radius:3px 6px 1px 1px}
.ptxt{position:absolute;right:2px;top:0;font-size:10px;color:var(--fl-ink);font-weight:700}
@media (prefers-reduced-motion:no-preference){
  .train{animation:run 7s linear infinite}
  @keyframes run{0%{left:-60px}45%{left:38%}60%{left:38%}100%{left:105%}}
  .w{transition:background .4s}
}
.ground{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.sign{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.sign i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--panel);display:inline-block}
.tlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.tlegend b{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--rule);padding-bottom:3px;min-width:0}
.kv span:first-child{color:var(--muted);font-size:12px}
.kv span:last-child{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.actions .btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:8px 10px;line-height:1.35}
.actions .btn small{color:var(--muted);font-size:11px}
.actions .btn.primary small{color:inherit;opacity:.85}
.actions .wide{grid-column:1/-1}
.actions .btn.locked{border-style:dashed}
.sub-h{font-size:11px;color:var(--muted);letter-spacing:.08em;grid-column:1/-1;margin-top:4px}
.note{font-size:12px;color:var(--muted);margin:0}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.pending{color:var(--warn)} .pill.building{color:var(--l1)} .pill.done{color:var(--good)} .pill.expired{color:var(--bad)}
.warn{color:var(--warn)} .bad{color:var(--bad)} .good{color:var(--good)}

/* 地図 */
.map{width:100%;height:auto;display:block;touch-action:manipulation}
.map .tile{fill:var(--tile);stroke:transparent;stroke-width:3;cursor:pointer}
.map .tile.sel{stroke:var(--accent)}
.map .tile.cand{stroke:var(--accent);stroke-dasharray:6 5}
.map .tile.mine{fill:color-mix(in srgb,var(--accent) 14%,var(--tile))}
.map .sea{fill:var(--sea)} .map .wave{fill:none;stroke:var(--sea-line);stroke-width:3;stroke-linecap:round}
.map .mtb{fill:var(--mount-bg)} .map .mt{fill:var(--mount)}
.map .farm{fill:var(--farm)} .map .furrow{stroke:var(--farm-line);stroke-width:4;stroke-linecap:round;pointer-events:none}
.map .pick{stroke:transparent;stroke-width:3;cursor:pointer} .map .pick.sel{stroke:var(--accent)}
.map .flabel{fill:var(--muted);font-size:13px;paint-order:stroke;stroke:var(--farm);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.map .name,.map .sub{paint-order:stroke;stroke:var(--tile);stroke-linejoin:round;pointer-events:none}
.map .name{fill:var(--ink);font-size:20px;font-weight:700;stroke-width:6px}
.map .sub{fill:var(--muted);font-size:15px;stroke-width:5px}
.map .stn{fill:var(--panel);stroke:var(--ink);stroke-width:3;pointer-events:none}
.map .dot{fill:var(--muted);pointer-events:none}
.map .badge{fill:var(--accent);pointer-events:none}
.map .badge-t{fill:var(--accent-ink);font-size:14px;font-weight:700;pointer-events:none}
.map .seg{stroke-width:8;stroke-linecap:round;fill:none;pointer-events:none}
.map .seg.l1{stroke:var(--l1)} .map .seg.l2{stroke:var(--l2)} .map .seg.l3{stroke:var(--l3)} .map .seg.l4{stroke:var(--l4)}
.map .seg.plan{stroke:var(--accent);stroke-dasharray:2 10;stroke-width:7}
.map .seg.wip{stroke-dasharray:9 7;opacity:.75}
.map .bldg{fill:var(--ink);pointer-events:none}
.mode{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.mode button{flex:1;border:0;background:var(--panel);padding:7px 8px;min-height:38px;font-weight:500}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--rule);background:var(--panel);border-radius:999px;padding:3px 12px;min-height:32px;display:inline-flex;align-items:center;gap:6px}
.chip b{width:14px;height:5px;border-radius:3px;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.chip:disabled{opacity:.45;cursor:not-allowed}
.plan-box{display:flex;flex-direction:column;gap:8px}
.route{font-weight:700;overflow-wrap:anywhere}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:18px;height:5px;border-radius:3px;vertical-align:middle;margin-right:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.inbox{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.inbox li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.inbox li:last-child{border-bottom:0}
.inbox .who{font-weight:700;min-width:0}
.inbox .what{grid-column:1/-1;font-size:12px;color:var(--muted)}
.inbox li.own .who::before{content:"自社 ";color:var(--accent)}

/* マイルストン・出来事 */
.ms-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ms{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.ms li{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ms li.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--panel))}
.ms .mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ms .mn{font-weight:700}
.ms .st{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.ms li.done .st{color:var(--good)}
.ms .cond,.ms .prog,.ms .rew{font-size:12px;margin:0}
.ms .cond{color:var(--muted)}
.ms .prog{font-variant-numeric:tabular-nums}
.ms .rew::before{content:"解放 ";color:var(--accent);font-weight:700}
.bar{height:4px;background:var(--tile);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.ms li.done .bar i{background:var(--good)}
.log{list-style:none;margin:0;padding:0;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.log li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;font-family:var(--f-display)}
.log li.good span{color:var(--good)} .log li.bad span{color:var(--bad)} .log li.own span{color:var(--accent)} .log li.event span{color:var(--event)}
.msg{min-height:1.4em;font-size:12px;color:var(--bad);margin:0}
.foot{font-size:11px;color:var(--muted);margin:0;text-align:center}
@media (max-width:520px){.row1{flex-wrap:nowrap;gap:6px}h1{font-size:16px}.date{font-size:13px}.row1 .btn{padding:4px 9px;min-height:34px;white-space:nowrap}.stat .v{font-size:16px}.tabs button{min-height:38px}header.top{gap:6px}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="row1">
      <h1>摩天楼と地下鉄</h1>
      <span class="date" id="date"></span>
      <button class="btn" id="step" aria-label="1か月進める">+1か月</button>
      <button class="btn primary" id="play">▶ 再生</button>
    </div>
    <div class="stats">
      <div class="stat"><span class="k">ビルの資金</span><span class="v" id="sCash"></span></div>
      <div class="stat"><span class="k">市の予算</span><span class="v" id="sBudget"></span></div>
      <div class="stat"><span class="k">市長支持率</span><span class="v" id="sAppr"></span></div>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabOwner" aria-selected="true" aria-controls="paneOwner">ビル経営</button>
      <button type="button" role="tab" id="tabMayor" aria-selected="false" aria-controls="paneMayor">市長</button>
    </div>
  </header>

  <div class="panes">
    <section class="pane" id="paneOwner" role="tabpanel">
      <div class="card">
        <span class="role">OWNER ／ 桜台タワー</span>
        <div class="stage">
          <div class="sky"><div class="tower" id="tower"></div></div>
          <div class="street"></div>
          <div class="under"><div class="tower" id="under"></div></div>
        </div>
        <div class="ground" id="ground"></div>
        <div class="tlegend" id="tlegend"></div>
        <div class="kv" id="ownerKv"></div>
      </div>
      <div class="card">
        <h2>経営判断</h2>
        <div class="actions">
          <span class="sub-h">地上</span>
          <button class="btn" id="addOffice"></button>
          <button class="btn" id="addShop"></button>
          <button class="btn" id="addHome"></button>
          <button class="btn" id="addElev"></button>
          <span class="sub-h">地下</span>
          <button class="btn" id="digMall"></button>
          <button class="btn" id="digPark"></button>
          <button class="btn primary wide" id="lobby"></button>
        </div>
        <p class="note" id="ownReq"></p>
        <p class="msg" id="ownerMsg"></p>
      </div>
    </section>

    <section class="pane" id="paneMayor" role="tabpanel" hidden>
      <div class="card">
        <span class="role">MAYOR ／ 地下鉄整備計画</span>
        <div class="mode" role="group" aria-label="計画の種類">
          <button type="button" id="modeNew" aria-pressed="true">新線を引く</button>
          <button type="button" id="modeExt" aria-pressed="false">既存線を延伸</button>
        </div>
        <div class="chips" id="lineChips" hidden></div>
        <svg class="map" id="map" viewBox="0 0 600 500" role="img" aria-label="市内の地区と地下鉄路線図"></svg>
        <div class="legend" id="legend"></div>
        <div class="plan-box" id="planBox"></div>
        <p class="msg" id="planMsg"></p>
      </div>
      <div class="card">
        <h2>市に届いている要望</h2>
        <ul class="inbox" id="inbox"></ul>
      </div>
    </section>
  </div>

  <div class="card">
    <div class="ms-head"><h2>マイルストン</h2><a class="btn" id="share" target="_blank" rel="noopener">Xで共有</a></div>
    <ul class="ms" id="ms"></ul>
  </div>

  <div class="card">
    <div class="ms-head"><h2>出来事</h2><button type="button" class="btn" id="reset">新しい街で始める</button></div>
    <ul class="log" id="log"></ul>
  </div>
  <p class="foot">このページは遊んだ人数を知るため Google Analytics でアクセスと進み具合を記録しています。個人を特定する情報は送っていません。</p>
</div>

<script>
(function(){
const track=(n,p)=>{try{window.track&&window.track(n,p)}catch(e){}};
const COLS=6, ROWS=5;
const N=COLS*ROWS;
const TERRAIN={mount:'山地',farm:'田園',sea:'海'};
const POOL_IN=['北山','緑丘','西原','東町','旭','本町','大橋','若葉','工場前','南町','日之出','松風','柳町','新田','高砂','錦町','栄町','寿町','花園','青葉','白鷺','宮前','東雲','梅ヶ丘','中島','川端'];
const POOL_SEA=['港北','港南','汐見','浜町','湊町','磯辺','潮見台','浜寺'];
const SEG_TOWN=2500, SEG_FARM=1000, STATION_COST=1500;
let TOWER=0, NAMES=[], LAND=[], COVER_GOAL=13;
const isLand=i=>S.map[i]==='town';
const isFarm=i=>S.map[i]==='farm';
const passable=i=>isLand(i)||isFarm(i);
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function nbrs(i){const[r,c]=[Math.floor(i/COLS),i%COLS],o=[];if(r>0)o.push(i-COLS);if(r<ROWS-1)o.push(i+COLS);if(c>0)o.push(i-1);if(c<COLS-1)o.push(i+1);return o}
function genMap(){
  for(let tries=0;tries<2000;tries++){
    const m=Array(N).fill('town');
    if(Math.random()<.8){
      const side=rnd(4), len=side%2===0?COLS:ROWS;let d=1+rnd(2);
      for(let k=0;k<len;k++){
        d=Math.max(0,Math.min(2,d+rnd(3)-1));
        for(let j=0;j<d;j++){
          const[r,c]=side===0?[j,k]:side===2?[ROWS-1-j,k]:side===1?[k,COLS-1-j]:[k,j];
          m[r*COLS+c]='sea';
        }
      }
    }
    const grow=(type,clusters,minS,maxS)=>{
      for(let k=0;k<clusters;k++){
        let cur=shuffle(m.map((t,i)=>i).filter(i=>m[i]==='town'))[0];
        const size=minS+rnd(maxS-minS+1);
        for(let n=0;n<size&&cur!==undefined;n++){m[cur]=type;cur=shuffle(nbrs(cur).filter(j=>m[j]==='town'))[0]}
      }
    };
    grow('mount',1+rnd(2),2,4);
    grow('farm',2,2,3);
    const towns=m.map((t,i)=>i).filter(i=>m[i]==='town');
    if(towns.length<14||towns.length>19) continue;
    const pass=i=>m[i]==='town'||m[i]==='farm';
    const seen=new Set([towns[0]]),q=[towns[0]];
    while(q.length){const x=q.shift();nbrs(x).forEach(j=>{if(pass(j)&&!seen.has(j)){seen.add(j);q.push(j)}})}
    if(towns.some(i=>!seen.has(i))) continue;
    // 最初の路線：市街地を4駅
    const start=towns[rnd(towns.length)],path=[start];let dir=null,ok=true;
    for(let k=0;k<3&&ok;k++){
      const cur=path[path.length-1];
      const opts=nbrs(cur).filter(j=>m[j]==='town'&&!path.includes(j));
      if(!opts.length){ok=false;break}
      const straight=opts.find(j=>j-cur===dir);
      const nx=straight!==undefined&&Math.random()<.65?straight:opts[rnd(opts.length)];
      dir=nx-cur;path.push(nx);
    }
    if(!ok) continue;
    const md=i=>Math.min(...path.map(p=>man(i,p)));
    const tc=towns.filter(i=>md(i)===2);
    if(!tc.length) continue;
    const tower=tc[rnd(tc.length)];
    return {m,path,tower,towns};
  }
  throw new Error('map');
}
function newWorld(){
  const g=genMap();
  const center=g.path.slice().sort((a,b)=>nbrs(b).filter(j=>g.m[j]==='town').length-nbrs(a).filter(j=>g.m[j]==='town').length)[0];
  const inl=shuffle(POOL_IN.slice()), sea=shuffle(POOL_SEA.slice());
  const districts=g.m.map((t,i)=>{
    if(t!=='town') return {name:TERRAIN[t],terrain:t,pop:0,pop0:0,biz:0,biz0:0};
    let name,pop,biz;
    if(i===g.tower){name='桜台';pop=14;biz=4}
    else if(i===center){name='中央';pop=45;biz=40}
    else{
      const d=man(i,center);
      name=(nbrs(i).some(j=>g.m[j]==='sea')&&sea.length)?sea.pop():inl.pop();
      pop=Math.max(10,Math.min(42,44-7*d+rnd(7)-3));
      biz=Math.max(4,Math.round(36*Math.pow(.55,d)+rnd(4)));
    }
    return {name,pop,pop0:pop,biz,biz0:biz};
  });
  const others=g.towns.filter(i=>i!==g.tower&&!g.path.includes(i));
  const req=others[rnd(others.length)];
  return {map:g.m,tower:g.tower,districts,path:g.path,req};
}
function bindMap(){
  TOWER=S.tower;NAMES=S.districts.map(d=>d.name);
  LAND=S.map.map((t,i)=>i).filter(i=>S.map[i]==='town');
  COVER_GOAL=Math.round(LAND.length*.8);
}
const ACCESS=[1,.7,.45,.3];
const RENT={office:110,shop:80,home:70,mall:95,parking:45};
const ORGS=['商店会','自治会','オフィス街協議会','PTA連合会','マンション管理組合'];
const LOBBY_COST=200, ELEV_COST=400;
const KIND={office:'オフィス',shop:'店舗',home:'住宅',lobby:'ロビー',mall:'地下街',parking:'駐車場'};
const TAG={office:'事務',shop:'店舗',home:'住宅',mall:'地下街',parking:'駐車場'};

function fresh(){
  const w=newWorld();
  return {
    v:4, map:w.map, tower:w.tower, month:0, cash:6000, budget:9000, approval:55, elevators:1, nextId:1,
    floors:[{type:'lobby',occ:1},{type:'office',occ:.4},{type:'office',occ:.35},{type:'shop',occ:.3}],
    base:[],
    districts:w.districts,
    lines:[{id:1,name:'1号線',color:'l1',nodes:w.path,loop:false,open:true,left:0,cost:0}],
    works:[], mode:'new', extLine:null, planLoop:false,
    requests:[{id:'r0',from:w.districts[w.req].name+'商店会',district:w.req,month:-5,status:'pending',own:false}],
    plan:[], log:[], ms:{}, fullStreak:0, lastIncome:0, lastCost:0, lastCity:0
  };
}
let S=null, timer=null;

const $=id=>document.getElementById(id);
const rc=i=>[Math.floor(i/COLS),i%COLS];
const man=(a,b)=>{const[r1,c1]=rc(a),[r2,c2]=rc(b);return Math.abs(r1-r2)+Math.abs(c1-c2)};
const adj=(a,b)=>man(a,b)===1;
const yen=v=>{const s=v<0?'−':'';v=Math.abs(Math.round(v));return v>=10000?`${s}${(v/10000).toFixed(2)}億円`:`${s}${v.toLocaleString()}万円`};
const dateOf=m=>{const y=2026+Math.floor((3+m)/12),mo=((3+m)%12+12)%12+1;return `${y}年${mo}月`};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const maxFloors=()=>S.ms.sky?24:16, maxElev=()=>S.ms.full?6:4, costMul=()=>S.ms.loop?.85:1, incomeMul=()=>S.ms.trust?1.15:1;

function edges(nodes,loop){const e=[];for(let j=1;j<nodes.length;j++)e.push([nodes[j-1],nodes[j]]);if(loop&&nodes.length>2)e.push([nodes[nodes.length-1],nodes[0]]);return e}
function stations(withWip){
  const s=new Set();
  S.lines.forEach(l=>{if(l.open||withWip)l.nodes.forEach(n=>{if(isLand(n))s.add(n)})});
  if(withWip)S.works.forEach(w=>w.nodes.forEach(n=>{if(isLand(n))s.add(n)}));
  return s;
}
function nearest(i){let best=9,who=null;stations(false).forEach(n=>{const d=man(i,n);if(d<best){best=d;who=n}});return{d:best,who}}
function wipFor(i){
  if(stations(false).has(i)) return null;
  return S.lines.find(l=>!l.open&&l.nodes.includes(i))||S.works.find(w=>w.nodes.includes(i))||null;
}
function lineById(id){return S.lines.find(l=>l.id===id)}
function extendable(l){return l.open&&!l.loop&&!S.works.some(w=>w.lineId===l.id)}
function upper(){return S.floors.filter(f=>f.type!=='lobby')}
function congestion(){return Math.max(0,upper().length-S.elevators*6)*.06}
function residents(){return S.floors.filter(f=>f.type==='home').reduce((a,f)=>a+f.occ,0)*2}
function popOf(i){return isLand(i)?S.districts[i].pop+(i===TOWER?residents():0):0}
function stationAtTower(){return nearest(TOWER).d===0}
function countType(t){return S.floors.filter(f=>f.type===t).length}
function parkBonus(cap){return Math.min(cap,S.base.filter(b=>b.type==='parking').length*.04)}
function towerTraffic(){
  const n=S.lines.filter(l=>l.open&&l.nodes.includes(TOWER)).length;
  return popOf(TOWER)*.6+S.districts[TOWER].biz*.8+upper().reduce((a,f)=>a+f.occ,0)*3+n*10;
}
function target(type,acc,pen,pop){
  switch(type){
    case 'home': return clamp(.3+.45*acc+(countType('shop')||S.base.some(b=>b.type==='mall')?.12:0)+parkBonus(.12)-pen*.5,.05,.98);
    case 'office': return clamp(.25+.65*acc-pen,.05,.98);
    case 'shop': return clamp(.1+.6*acc+.3*Math.min(1,pop/40)+parkBonus(.08)-pen,.05,.98);
    case 'mall': return clamp(.2+.75*Math.min(1,towerTraffic()/45),.05,.98);
    case 'parking': return clamp(.25+.06*(countType('office')+countType('home')),.05,.95);
  }
  return 0;
}
function log(text,kind){S.log.unshift({m:S.month,text,kind:kind||''});S.log=S.log.slice(0,40)}

function ridership(nodes){
  const st=stations(true);let r=0;
  nodes.forEach(n=>{
    if(!isLand(n)) return;
    const d=S.districts[n];let v=popOf(n)*.6+d.biz*.8;
    if(n===TOWER) v+=upper().reduce((a,f)=>a+f.occ,0)*3;
    r+= st.has(n)? v*.5+8 : v;
  });
  return r;
}
function planCost(nodes,loop){
  const st=stations(true);
  const e=edges(nodes,loop&&nodes.length>2);
  const segc=(a,b)=>((isFarm(a)?SEG_FARM:SEG_TOWN)+(isFarm(b)?SEG_FARM:SEG_TOWN))/2;
  const seg=e.length, neu=nodes.filter(n=>isLand(n)&&!st.has(n)).length;
  const farm=nodes.filter(isFarm).length;
  const raw=e.reduce((a,[x,y])=>a+segc(x,y),0)+neu*STATION_COST;
  const months=e.reduce((a,[x,y])=>a+(isFarm(x)||isFarm(y)?2:3),0);
  return {seg,neu,farm,cost:Math.round(raw*costMul()),months};
}

/* ---------- 開業と工事中のできごと ---------- */
function settle(p,nodes,cost,r,label,name){
  const eff=r/Math.max(1,cost)*1000;
  log(`${label}。1日 ${(r/10).toFixed(1)}万人の利用見込み`,'good');
  let delta=0;
  S.requests.forEach(q=>{
    if(q.status==='pending'&&nodes.includes(q.district)){
      q.status='done';delta+=4;
      log(q.own?`自社の要望が実現。${NAMES[q.district]}駅が開業しました`:`${q.from}の要望が実現（支持率 +4）`,q.own?'own':'good');
    }
  });
  if(p.ruins!==undefined){
    const d=S.districts[p.ruins];d.biz+=4;d.biz0+=4;
    log(`${NAMES[p.ruins]}駅の構内に出土品の展示室ができ、見物客で賑わっています`,'event');
  }
  if(eff>=9){delta+=3;log(`${name}は利用好調と報道（支持率 +3）`,'good')}
  else if(eff<5){delta-=4;log(`${name}は費用に見合わないと批判（支持率 −4）`,'bad')}
  S.approval=clamp(S.approval+delta,0,100);
}
function openLine(l){
  l.open=true;
  settle(l,l.nodes,l.cost,ridership(l.nodes),`${l.name}（${l.nodes.map(n=>NAMES[n]).join('–')}${l.loop?'・環状':''}）が開業`,l.name);
}
function openWork(w){
  const l=lineById(w.lineId);
  const mid=w.loop?w.nodes.slice(1,-1):w.nodes.slice(1);
  if(w.fromStart) l.nodes=[...mid.slice().reverse(),...l.nodes];
  else l.nodes=[...l.nodes,...mid];
  if(w.loop) l.loop=true;
  const label=w.loop?`${l.name}の延伸区間が完成し、環状線になりました`:`${l.name}の延伸区間（${w.nodes.map(n=>NAMES[n]).join('–')}）が開業`;
  settle(w,mid,w.cost,ridership(w.nodes),label,`${l.name}の延伸区間`);
}
function projName(p){return p.lineId?`${lineById(p.lineId).name}の延伸工事`:`${p.name}の工事`}
function constructionEvents(){
  const st=stations(false);
  [...S.lines.filter(l=>!l.open),...S.works].forEach(p=>{
    if(p.left<=2||(p.ev||0)>=2||Math.random()>.035) return;
    p.ev=(p.ev||0)+1;
    const cand=p.nodes.filter(n=>isLand(n)&&!st.has(n));
    const at=cand.length?cand[Math.floor(Math.random()*cand.length)]:p.nodes[Math.floor(Math.random()*p.nodes.length)];
    const r=Math.random();
    if(r<.5&&p.ruins===undefined&&cand.length){
      p.left+=6;p.ruins=at;
      log(`${projName(p)}中、${NAMES[at]}の地下で古代の遺跡が見つかりました。発掘調査のため工期が6か月延びます。市民の関心は高く、支持率は下がりません`,'event');
      track('event',{kind:'ruins'});
    }else if(r<.8){
      const extra=Math.round(p.cost*.1);
      p.left+=3;S.budget-=extra;S.approval=clamp(S.approval-1,0,100);
      log(`${projName(p)}中、${NAMES[at]}付近で地下水が大量に湧き出しました。工期3か月延長、追加費用${yen(extra)}（支持率 −1）`,'bad');
      track('event',{kind:'water'});
    }else{
      const cut=Math.min(3,p.left-1);p.left-=cut;
      log(`${projName(p)}に新型シールドマシンを投入。工期が${cut}か月縮まりました`,'good');
      track('event',{kind:'shield'});
    }
  });
}

function maybeRival(){
  const pend=S.requests.filter(q=>q.status==='pending'&&!q.own).length;
  if(pend>=3||Math.random()>.18) return;
  const st=stations(true);
  const cand=LAND.filter(i=>i!==TOWER&&!st.has(i)&&!S.requests.some(q=>q.status==='pending'&&q.district===i));
  if(!cand.length) return;
  const tot=cand.reduce((a,i)=>a+S.districts[i].pop,0);let x=Math.random()*tot,pick=cand[0];
  for(const i of cand){x-=S.districts[i].pop;if(x<=0){pick=i;break}}
  const from=NAMES[pick]+ORGS[Math.floor(Math.random()*ORGS.length)];
  S.requests.push({id:'r'+(S.nextId++),from,district:pick,month:S.month,status:'pending',own:false});
  log(`${from}から${NAMES[pick]}への地下鉄延伸の要望が届きました`);
}

function tick(){
  S.month++;
  const prevCash=S.cash;
  const st=stations(false);
  LAND.forEach(i=>{const d=S.districts[i];if(st.has(i)){d.pop=Math.min(d.pop*1.006,d.pop0*1.8);d.biz=Math.min(d.biz*1.008,d.biz0*2)}});
  const acc=ACCESS[Math.min(nearest(TOWER).d,3)], pen=congestion(), pop=popOf(TOWER);
  let inc=0;
  upper().forEach(f=>{f.occ+=(target(f.type,acc,pen,pop)-f.occ)*.25;inc+=f.occ*RENT[f.type]});
  S.base.forEach(b=>{b.occ+=(target(b.type)-b.occ)*.25;inc+=b.occ*RENT[b.type]});
  const cost=S.floors.length*12+S.base.length*15+S.elevators*20;
  S.lastIncome=Math.round(inc);S.lastCost=cost;S.cash+=Math.round(inc-cost);
  const base=LAND.reduce((a,i)=>a+popOf(i)*.9+S.districts[i].biz*1.2,0)+upper().reduce((a,f)=>a+f.occ,0)*5;
  S.lastCity=Math.round(base*(.7+.6*S.approval/100)*incomeMul());S.budget+=S.lastCity;
  constructionEvents();
  S.lines.forEach(l=>{if(!l.open){l.left--;if(l.left<=0)openLine(l)}});
  S.works.forEach(w=>{w.left--;if(w.left<=0)openWork(w)});
  S.works=S.works.filter(w=>w.left>0);
  let stale=0;
  S.requests.forEach(q=>{
    if(q.status!=='pending')return;
    const age=S.month-q.month;
    if(age>=24&&!wipFor(q.district)){q.status='expired';S.approval-=3;log(`${q.from}の要望が棚上げのまま失効（支持率 −3）`,'bad')}
    else if(age>=12&&!wipFor(q.district)) stale++;
  });
  S.approval=clamp(S.approval+(50-S.approval)*.015-stale*.3,0,100);
  maybeRival();
  checkMilestones();
  if(S.month%12===0) track('year_passed',{year:dateOf(S.month).slice(0,4)});
  if(prevCash>=0&&S.cash<0) log('ビルの資金が赤字に転落しました','bad');
  render();
}

/* ---------- マイルストン ---------- */
function avgOcc(){const u=upper();return u.length?u.reduce((a,f)=>a+f.occ,0)/u.length:0}
function staleCount(){return S.requests.filter(q=>q.status==='pending'&&S.month-q.month>=12&&!wipFor(q.district)).length}
function coverage(){return LAND.filter(i=>nearest(i).d<=1).length}
const MS=[
  {id:'station',name:'駅前ビル',cond:'桜台に駅が開業する',reward:'住宅階と地下B1F〜B4Fの開発',
   prog:()=>{const w=wipFor(TOWER);return [w?`桜台駅 工事中・あと${w.left}か月`:'桜台駅 未計画',w?.5:0]},
   test:()=>stationAtTower(),
   onDone:()=>log('B5Fに桜台駅のホームが入りました。住宅階と地下の開発ができます','own')},
  {id:'full',name:'満室',cond:'地上の平均入居率80%以上を3か月続ける',reward:'エレベーター上限 4基→6基',
   prog:()=>[`入居率${Math.round(avgOcc()*100)}%・連続${S.fullStreak}/3か月`,Math.min(1,S.fullStreak/3)],
   test:()=>S.fullStreak>=3},
  {id:'trust',name:'信任',cond:'支持率60%以上で、12か月以上放置した要望がない',reward:'市の月収入 +15%',
   prog:()=>[`支持率${Math.round(S.approval)}%・放置要望${staleCount()}件`,Math.min(1,S.approval/60)*(staleCount()?.5:1)],
   test:()=>S.approval>=60&&staleCount()===0},
  {id:'loop',name:'環状線',cond:'環状線を1本開業させる',reward:'以後の建設費 −15%',
   prog:()=>{const w=S.works.find(x=>x.loop)||S.lines.find(l=>l.loop&&!l.open);return [w?`環状化工事中・あと${w.left}か月`:'環状線なし',w?.5:0]},
   test:()=>S.lines.some(l=>l.loop&&l.open)},
  {id:'sky',name:'摩天楼',cond:()=>`地上16階以上、かつ${LAND.length}地区中${COVER_GOAL}地区が駅から1区画以内`,reward:'ビルの上限 17階→25階',
   prog:()=>[`${S.floors.length}/16階・駅1区画以内${coverage()}/${COVER_GOAL}地区`,(Math.min(1,S.floors.length/16)+Math.min(1,coverage()/COVER_GOAL))/2],
   test:()=>S.floors.length>=16&&coverage()>=COVER_GOAL}
];
function checkMilestones(){
  S.fullStreak=avgOcc()>=.8?S.fullStreak+1:0;
  MS.forEach(m=>{
    if(S.ms[m.id]===undefined&&m.test()){
      S.ms[m.id]=S.month;
      log(`マイルストン「${m.name}」達成。${m.reward}`,'good');
      track('milestone',{milestone_id:m.id,game_date:dateOf(S.month)});
      m.onDone&&m.onDone();
    }
  });
}
function shareUrl(){
  const done=MS.filter(m=>S.ms[m.id]!==undefined);
  const last=done.slice().sort((a,b)=>S.ms[b.id]-S.ms[a.id])[0];
  const text=last
    ?`「摩天楼と地下鉄」で${dateOf(S.ms[last.id])}にマイルストン「${last.name}」を達成。${done.length}/${MS.length}達成、ビルは地上${S.floors.length}階・地下${S.base.length+(stationAtTower()?1:0)}階、地下鉄${S.lines.length}路線`

  if(!p.length&&isFarm(i)&&S.mode==='new') return planMsg('田園には駅を作れません。駅を置ける地区から始めてください');

    if(i===last||(S.mode==='new'&&i===p[0])){S.planLoop=false;if(S.mode==='ext')p.pop();return render()}

  }
  if(S.mode==='ext'){
    const l=S.extLine?lineById(S.extLine):null;
    if(!l) return planMsg('先に延伸する路線を選んでください');
    const a=l.nodes[0],b=l.nodes[l.nodes.length-1];
    if(!p.length){
      if(i!==a&&i!==b) return planMsg(`${l.name}の端（${NAMES[a]}か${NAMES[b]}）から始めてください`);

    const other=p[0]===a?b:a;
    if(i===other&&adj(last,i)&&l.nodes.length>=3){p.push(i);S.planLoop=true;return render()}
    if(l.nodes.includes(i)||p.includes(i)) return planMsg('同じ路線の駅を2回通ることはできません');
    if(!adj(last,i)) return planMsg(`${NAMES[last]}の隣の地区を選んでください`);
    p.push(i);return render();
  }
  if(!p.length) p.push(i);
  else if(i===last) p.pop();
  else if(i===p[0]&&p.length>=3&&adj(last,i)) S.planLoop=true;
  else if(p.includes(i)) return planMsg('同じ地区を2回通ることはできません');
  else if(adj(last,i)) p.push(i);
  else if(p.length===1) p[0]=i;
  else return planMsg(`${NAMES[last]}の隣の地区を選んでください`);
  render();
}
function build(){
  const p=S.plan, ext=S.mode==='ext', loopNew=!ext&&S.planLoop;
  const {cost,months}=planCost(p,loopNew);
  if(p.length<2||S.budget<cost||(!S.planLoop&&isFarm(p[p.length-1]))) return;
  const hits=S.requests.filter(q=>q.status==='pending'&&p.includes(q.district));
  S.budget-=cost;
  if(hits.length) S.approval=clamp(S.approval+hits.length,0,100);
  const tail=`${yen(cost)}、工期${months}か月${hits.length?`（要望${hits.length}件に対応、支持率 +${hits.length}）`:''}`;
  if(ext){
    const l=lineById(S.extLine);
    S.works.push({lineId:l.id,nodes:[...p],fromStart:p[0]===l.nodes[0]&&l.nodes.length>1,loop:S.planLoop,left:months,cost});
    log(`${l.name}の延伸（${p.map(i=>NAMES[i]).join('–')}${S.planLoop?'・環状化':''}）を着工。${tail}`);
    S.extLine=null;
  }else{
    const n=S.lines.length+1;
    S.lines.push({id:n,name:`${n}号線`,color:'l'+((n-1)%4+1),nodes:[...p],loop:loopNew,open:false,left:months,cost});
    log(`${n}号線（${p.map(i=>NAMES[i]).join('–')}${loopNew?'・環状':''}）を着工。${tail}`);
  }
  track('build',{kind:ext?'extend':'new'});
  S.plan=[];S.planLoop=false;render();
}
function renderInbox(){
  const list=[...S.requests].sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||b.month-a.month).slice(0,8);
  const lbl={pending:'未対応',done:'実現',expired:'失効'};
  $('inbox').innerHTML=list.length?list.map(q=>{
    const w=q.status==='pending'&&wipFor(q.district);
    const cls=w?'building':q.status, txt=w?'工事中':lbl[q.status];
    return `<li class="${q.own?'own':''}"><span class="who">${q.from}</span><span class="pill ${cls}">${txt}</span><span class="what">${NAMES[q.district]}に駅を ・ ${dateOf(q.month)}受付${q.status==='pending'&&!w?`・${S.month-q.month}か月経過`:''}</span></li>`;
  }).join(''):'<li><span class="what">要望はまだありません</span></li>';
}

function render(){
  $('date').textContent=dateOf(S.month);
  $('sCash').textContent=yen(S.cash);$('sCash').classList.toggle('neg',S.cash<0);
  $('sBudget').textContent=yen(S.budget);
  $('sAppr').textContent=Math.round(S.approval)+'%';
  renderTower();renderMap();renderPlan();renderInbox();renderMs();
  $('log').innerHTML=S.log.slice(0,10).map(e=>`<li class="${e.kind}"><time>${dateOf(e.m)}</time><span>${e.text}</span></li>`).join('');
}

/* ---------- 入力 ---------- */
let started=false;
function startOnce(){if(!started){started=true;track('game_start')}}
$('step').addEventListener('click',()=>{startOnce();tick()});
$('play').addEventListener('click',()=>{
  startOnce();
  if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ 再生'}
  else{timer=setInterval(tick,1500);$('play').textContent='❚❚ 停止'}
});
$('share').addEventListener('click',()=>track('share',{method:'x'}));
$('addOffice').addEventListener('click',()=>addFloor('office'));
$('addShop').addEventListener('click',()=>addFloor('shop'));
$('addHome').addEventListener('click',()=>addFloor('home'));
$('addElev').addEventListener('click',addElev);
$('digMall').addEventListener('click',()=>dig('mall'));
$('digPark').addEventListener('click',()=>dig('parking'));
$('lobby').addEventListener('click',lobbyRequest);
$('map').addEventListener('click',e=>{
  const t=e.target.closest('[data-i]');if(t) return tapDistrict(+t.dataset.i);
  const u=e.target.closest('[data-t]');if(u) tapDistrict(+u.dataset.t);
});
$('map').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.i){e.preventDefault();tapDistrict(+e.target.dataset.i)}});
function setMode(m){S.mode=m;S.plan=[];S.planLoop=false;if(m==='new')S.extLine=null;render()}
$('modeNew').addEventListener('click',()=>setMode('new'));
$('modeExt').addEventListener('click',()=>{setMode('ext');const c=S.lines.filter(extendable);if(c.length===1){S.extLine=c[0].id;render()}});
$('lineChips').addEventListener('click',e=>{const b=e.target.closest('[data-line]');if(!b||b.disabled)return;S.extLine=+b.dataset.line;S.plan=[];S.planLoop=false;render()});
function tab(owner){
  $('tabOwner').setAttribute('aria-selected',String(owner));
  $('tabMayor').setAttribute('aria-selected',String(!owner));
  $('paneOwner').hidden=!owner;
  $('paneMayor').hidden=owner;
  try{window.scrollTo({top:0})}catch(e){window.scrollTo(0,0)}
}
$('tabOwner').addEventListener('click',()=>tab(true));
$('tabMayor').addEventListener('click',()=>tab(false));

function newGame(){
  S=fresh();bindMap();
  const n=nearest(TOWER);
  log(`桜台タワーの経営を引き継ぎました。最寄りの${NAMES[n.who]}駅から${n.d}区画離れていて、空室が目立ちます`);
  log(`${S.requests[0].from}から${NAMES[S.requests[0].district]}への地下鉄延伸の要望が届いています`);
}
let resetArm=null;
$('reset').addEventListener('click',()=>{
  if(!resetArm){
    $('reset').textContent='もう一度押すと最初からになります';
    resetArm=setTimeout(()=>{resetArm=null;$('reset').textContent='新しい街で始める'},3000);
    return;
  }
  clearTimeout(resetArm);resetArm=null;$('reset').textContent='新しい街で始める';
  if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ 再生'}
  newGame();track('new_map');render();
});
function start(data){
  if(data&&data.S&&data.S.v===4){S=data.S;bindMap()}
  else newGame();
  render();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
